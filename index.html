<html>
<head>
    <title>Assignment 5 - JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>Assignment 5</h1>
            <span>IT-2513</span>
        </div>
    </header>

    <main class="container">
        <div class="columns">
            <section class="panel">
                <h2>Part 1</h2>
                <div class="profile">
                    <div class="avatar" id="profileAvatar">A</div>
                    <div>
                        <h3 id="profileName">Almadi</h3>
                    </div>
                </div>

                <div class="stats">
                    <div><span class="label">Age</span><strong id="profileAge">19</strong></div>
                    <div><span class="label">Hobbies</span><strong id="hobbyCount">3</strong></div>
                </div>

                <p id="profileDetails"></p>
                <div id="hobbyTags" class="hobbies"></div>
                <hr>

                <h2>Part 2</h2>
                <form id="profileForm" novalidate>
                    <label for="username">Name</label>
                    <input type="text" id="username" placeholder="Enter your name" required maxlength="40">

                    <label for="birthYear">Birth year</label>
                    <input type="number" id="birthYear" placeholder="For example, 2008" min="1900" required>

                    <button type="submit">Update profile</button>
                    <p id="formMessage" class="message" aria-live="polite"></p>
                </form>
            </section>

            <section class="panel">
                <h2>Part 3</h2>
                <form id="taskForm" class="task-form" novalidate>
                    <label for="taskInput">New hobby</label>
                    <input type="text" id="taskInput" placeholder="Enter a hobby" maxlength="80" required>
                    <button type="submit">Add item</button>
                </form>

                <p class="list-count">Items: <span id="taskCount">3</span></p>
                <ul id="taskList">
                    <li>Practice JavaScript</li>
                    <li>Read a book</li>
                    <li>Play guitar</li>
                </ul>

                <button type="button" class="secondary" id="removeTaskButton">Remove last item</button>
                <p id="taskMessage" class="message" aria-live="polite"></p>
            </section>
        </div>
    </main>

</body>
</html>
